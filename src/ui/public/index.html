<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muninn</title>
<style>
/* Design C, "Switches": one screen, like phone settings. Suggestions with Add, your lessons with on/off switches,
   two settings. See docs/design-language.md. No web fonts, so the page makes no requests off this machine. */
:root {
  --bg: #F5F5F3; --group: #FFFFFF; --line: #EDEDEA; --line-strong: #DADAD6;
  --ink: #1C1D21; --muted: #6B6E76; --faint: #9A9CA3;
  --on: #1F7A45; --off: #D9D9D5; --link: #2B3AB8; --chip: #EDEFFE; --warn: #B23E06; --warn-bg: #FDF1EA;
  --sans: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111214; --group: #1C1D21; --line: #2A2C31; --line-strong: #3A3C43; --ink: #ECECEF; --muted: #A1A3AB; --faint: #74767E;
    --on: #3DBB72; --off: #3A3C43; --link: #A9B1FF; --chip: #262B4D; --warn: #FF9C6E; --warn-bg: #2A1E17; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--link); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
main { max-width: 680px; margin: 0 auto; padding: 36px 20px 72px; }
.top { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.top select { border: 0; background: none; color: var(--muted); font-size: 14px; padding: 2px 0; cursor: pointer; }
h1 { margin: 4px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -.4px; line-height: 1.2; }
.lead { margin: 6px 0 0; color: var(--muted); }
section { margin-top: 30px; }
h2 { margin: 0 0 8px 4px; font-size: 13px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.group { list-style: none; margin: 0; padding: 0; background: var(--group); border-radius: 14px; overflow: hidden; }
.group > li { border-top: 1px solid var(--line); }
.group > li:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; }
.row .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; }
.row .sub { font-size: 13px; color: var(--muted); }
.row .warnline { font-size: 13px; color: var(--warn); margin-top: 2px; }
.row.off .title { color: var(--faint); }
.note { margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
.more { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 14px 18px; color: var(--link); font-weight: 500; cursor: pointer; }
.add { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--chip); color: var(--link); font-size: 14px; font-weight: 600; cursor: pointer; flex: none; }
.x { width: 34px; height: 34px; border: 0; border-radius: 999px; background: none; color: var(--faint); cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.x:hover { background: var(--bg); color: var(--muted); }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; background: var(--off); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--on); }
.switch[aria-checked="true"]::after { left: 21px; }
.switch:disabled { opacity: .5; cursor: default; }
.detail { padding: 4px 18px 18px; }
.detail label, .detail .lbl { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); font: 14px/1.6 var(--mono); resize: vertical; }
input[type=text] { width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); padding: 0 12px; margin-top: 8px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; }
.choices button[aria-checked="true"] { border-color: var(--ink); background: var(--ink); color: var(--group); }
.checkline, .detail .checkline { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 400; margin-top: 14px; width: auto; }
.checkline input { margin: 0; width: 16px; height: 16px; flex: none; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.replay { margin-top: 10px; }
.replaylist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.replaylist .mono { font-size: 12px; margin-top: 2px; }
.replaylist li, .replaylist .sub { font-size: 12px; font-weight: 400; color: var(--muted); padding: 0; }
.btns { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--group); font-weight: 600; }
.btn.textbtn { border: 0; background: none; padding: 0; height: auto; color: var(--warn); margin-left: auto; }
.fix { height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.evidence { font-size: 13px; color: var(--muted); margin-top: 12px; }
.evidence .run { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--ink); white-space: pre-wrap; }
.empty { padding: 16px 18px; color: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--group); cursor: pointer; flex: none; padding: 0; }
.check:hover { border-color: var(--on); }
.check[aria-checked="true"] { background: var(--on); border-color: var(--on); }
.sublist { list-style: none; margin: 0; padding: 0 18px 12px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; overflow-wrap: anywhere; }
.donebox input[type=search] { margin: 0 18px 10px; width: calc(100% - 36px); box-sizing: border-box; }
.doneday { padding: 6px 18px 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.sublist li { padding: 6px 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sublist .x { width: 26px; height: 26px; font-size: 15px; margin-left: auto; }
.scan { margin: 10px 0 0; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--link); font-size: 14px; font-weight: 500; cursor: pointer; }
.linkbtn:disabled { opacity: .5; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--group); padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after, .toast { transition: none; } }
</style>
</head>
<body>
<main id="main" aria-live="polite"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const TOKEN = "__TOKEN__";
const HERE = __REPO__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (r) => (r ? String(r).split("/").filter(Boolean).pop() : "all repos");
const q = (o) => new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString();
const ago = (iso) => { const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 60 ? "just now" : m < 2880 ? `${Math.round(m / 60)} hours ago` : `${Math.round(m / 1440)} days ago`; };
const WHEN = { always: "Every session", keyword: "When a word comes up", none: "Only if an agent looks it up" };
/* What each choice means, in a sentence under the choices. */
const WHEN_HINT = {
  always: "Told to agents at the start of every session in this repo.",
  keyword: "Told when one of these words is in your prompt, or in a command that failed.",
  none: "Never sent on its own. At the start of each session agents are told they can run muninn ask \"…\" to look things up, and this is one of the things they'd find.",
};
let repo = HERE || "";
let showAll = false;
let open = null; // the id of the row opened for editing
let data = null;
let planEdit = null; // the plan item being edited: an id, "goal", or "new"
let planBranch = null; // the branch whose plan is shown; null means the one checked out
const planShow = { decisions: false, done: false };

/* The running plan: built from your sessions' handoffs, and yours to edit. */
let doneFilter = ""; // text typed in the Done filter
let doneLimit = 15; // how many done items show before "Show more"
/** What's done, newest first, grouped by day and narrowed by the filter, so a long history stays easy to scan. */
function doneList(items) {
  const words = doneFilter.toLowerCase().split(/\s+/).filter(Boolean);
  const hits = items.filter((d) => words.every((w) => d.text.toLowerCase().includes(w)));
  if (!hits.length) return `<p class="note" style="margin:0 0 8px">Nothing done matches "${esc(doneFilter)}".</p>`;
  const dayOf = (d) => (d.closed_at || d.created_at).slice(0, 10);
  const today = new Date().toISOString().slice(0, 10), yesterday = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  const label = (day) => (day === today ? "Today" : day === yesterday ? "Yesterday" : new Date(day + "T12:00:00Z").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }));
  const shown = words.length ? hits : hits.slice(0, doneLimit);
  const groups = [];
  for (const d of shown) { const day = dayOf(d); if (groups.at(-1)?.day !== day) groups.push({ day, items: [] }); groups.at(-1).items.push(d); }
  return groups.map((g) => `<div class="doneday">${label(g.day)} · ${g.items.length}</div><ul class="sublist">${g.items.map((d) => `<li><span>${esc(d.text)}</span>${d.kind === "open" ? ` <button class="linkbtn" data-plan-reopen="${esc(d.id)}">reopen</button>` : ""}</li>`).join("")}</ul>`).join("")
    + (shown.length < hits.length ? `<button class="more" data-done-more>Show ${Math.min(15, hits.length - shown.length)} more of ${hits.length - shown.length}</button>` : "");
}
const shortDate = (iso) => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
function planEditor(kind, id, value, placeholder) {
  return `<div class="row" style="gap:8px"><label class="vh" for="pe">${esc(placeholder)}</label><input id="pe" type="text" data-plan-input data-kind="${kind}" data-id="${esc(id || "")}" value="${esc(value)}" placeholder="${esc(placeholder)}" style="margin:0;flex:1"><button class="btn primary" data-plan-save>Save</button><button class="btn" data-plan-cancel>Cancel</button></div>`;
}
/* Lines in CLAUDE.md that may be out of date. Agents read the file every session, so a stale line costs each time. */
const MEMORY_WHY = { missing_path: "Names something that isn't in the repo", missing_command: "Names a command that no longer exists", unused: "Never comes up" };
function memorySection() {
  const rows = data.memory || [];
  if (!rows.length) return "";
  const open = rows.filter((r) => r.status === "open").length;
  return `<section aria-labelledby="mm">
    <h2 id="mm">In your CLAUDE.md${open ? ` · ${open} may be out of date` : ""}</h2>
    <ul class="group">${rows.map((r) => r.status === "removed"
      ? `<li><div class="row"><div class="main" style="cursor:default"><div class="title" style="color:var(--muted)">Removed from ${esc(r.file)}</div><div class="sub mono">${esc(r.text)}</div></div><button class="btn" data-mem-restore="${esc(r.id)}">Put it back</button></div></li>`
      : `<li><div class="row"><div class="main" style="cursor:default"><div class="title mono">${esc(r.text)}</div><div class="sub">${esc(MEMORY_WHY[r.reason] || "")}: ${esc(r.detail.replace(/\`/g, ""))}. ${esc(r.file)}${!repo ? ` in ${esc(short(r.repo_id))}` : ""}, line ${r.line}.</div></div>
          <button class="x" data-mem-keep="${esc(r.id)}" aria-label="Keep this line" title="Keep this line">×</button>
          <button class="add" data-mem-remove="${esc(r.id)}">Remove</button></div></li>`).join("")}</ul>
    <p class="note">Agents read these files at the start of every session, so an out-of-date line costs tokens each time and can send them the wrong way. Remove edits the file; × keeps the line and stops muninn asking.</p>
  </section>`;
}
function planSection() {
  if (!repo || !data.plan) return "";
  const p = data.plan.plan;
  const empty = !p.goal && !p.status && !p.open.length && !p.decisions.length && !p.done.length;
  const openRow = (o) => planEdit === o.id ? `<li>${planEditor("open", o.id, o.text, "A next step or open question")}</li>` : `<li><div class="row">
      <button class="check" role="checkbox" aria-checked="false" aria-label="Mark done: ${esc(o.text)}" data-plan-close="${esc(o.id)}"></button>
      <button class="main" data-plan-edit="${esc(o.id)}"><div class="title">${esc(o.text)}</div><div class="sub">${o.by_person ? "added by you" : `from a session on ${shortDate(o.created_at)}`}</div></button>
      <button class="x" data-plan-remove="${esc(o.id)}" aria-label="Remove" title="Remove">×</button></div></li>`;
  return `<section aria-labelledby="pl">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <h2 id="pl">Plan for this branch</h2>
      <span style="font-size:14px;color:var(--muted)"><label class="vh" for="planBranch">Branch</label>
        <select id="planBranch" style="border:0;background:none;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer">${data.plan.branches.map((b) => `<option value="${esc(b.name)}" ${b.name === data.plan.branch ? "selected" : ""}>${esc(b.name)}${b.name === data.plan.checkedOut ? " (checked out)" : b.merged ? " (merged)" : ""}</option>`).join("")}</select></span>
    </div>
    <ul class="group">
      ${planEdit === "goal" ? `<li>${planEditor("goal", "", p.goal?.text ?? "", "What this project is trying to do")}</li>`
        : `<li><div class="row"><button class="main" data-plan-edit="goal"><div class="sub">Goal</div><div class="title">${p.goal ? esc(p.goal.text) : '<span style="color:var(--link)">Add a goal</span>'}</div></button></div></li>`}
      ${planEdit === "status" ? `<li>${planEditor("status", "", p.status?.text ?? "", "Where things stand, in a few sentences")}</li>`
        : `<li><div class="row"><button class="main" data-plan-edit="status"><div class="sub">Where it stands${p.status ? ` · ${p.status.by_person ? "written by you" : `updated ${esc(shortDate(p.status.at))}`}` : ""}</div><div class="title" style="font-weight:400">${p.status ? esc(p.status.text) : '<span style="color:var(--link)">Add a summary</span>'}</div></button></div></li>`}
      ${p.open.length ? `<li><div class="sub" style="padding:10px 14px 0">Next</div></li>` : ""}
      ${p.open.map(openRow).join("")}
      ${planEdit === "new" ? `<li>${planEditor("open", "", "", "A next step or open question")}</li>` : `<li><button class="more" data-plan-new>+ Add a next step</button></li>`}
      ${p.decisions.length ? `<li><button class="more" data-plan-toggle="decisions" style="color:var(--ink)">Decisions · ${p.decisions.length} <span class="sub">${planShow.decisions ? "hide" : "show"}</span></button>
        ${planShow.decisions ? `<ul class="sublist">${p.decisions.map((d) => `<li><span class="sub">${shortDate(d.created_at)}</span> ${esc(d.text)} <button class="x" data-plan-remove="${esc(d.id)}" aria-label="Remove">×</button></li>`).join("")}</ul>` : ""}</li>` : ""}
      ${p.done.length ? `<li><button class="more" data-plan-toggle="done" style="color:var(--ink)">Done · ${p.done.length} <span class="sub">${planShow.done ? "hide" : "show"}</span></button>
        ${planShow.done ? `<div class="donebox">${p.done.length > 8 ? `<label class="vh" for="doneFilter">Filter what's done</label><input id="doneFilter" type="search" placeholder="Filter what's done" value="${esc(doneFilter)}" autocomplete="off">` : ""}<div id="doneList">${doneList(p.done)}</div></div>` : ""}</li>` : ""}
    </ul>
    <p class="note">${data.plan.branches.find((b) => b.name === data.plan.branch)?.merged ? "This branch is merged, so its work is finished. " : ""}${empty ? "Each branch is its own piece of work. muninn builds its plan from the sessions on it: a short summary of where things stand, the next few steps, and the decisions that still hold. You can also write your own." : "Rewritten as your sessions go, and checked against the branch's commits and pull requests. Agents working on this branch get it when a session starts. Anything you write yourself stays as you wrote it."}</p>
  </section>`;
}
async function planDo(body) { const r = await api("/api/plan", { repo, branch: data.plan.branch, ...body }); data.plan = r; planEdit = null; draw(); }

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "x-muninn-token": TOKEN, "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || "Request failed");
  return j;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2800); }

async function load() {
  const [repos, suggested, kept, home, scan] = await Promise.all([
    api("/api/repos"), api("/api/lessons?" + q({ repo, status: "proposed" })), api("/api/lessons?" + q({ repo, status: "live" })), api("/api/home?" + q({ repo })), api("/api/scan"),
  ]);
  const [plan, memory] = await Promise.all([repo ? api("/api/plan?" + q({ repo, branch: planBranch })) : null, api("/api/memory?" + q({ repo }))]);
  data = { repos, suggested, kept, home, scan, plan, memory };
}

/* muninn checks your sessions on its own after they end. This line shows when it last did, and lets you ask now. */
function scanLine() {
  const s = data.scan;
  if (s.running) return `<span class="spin" aria-hidden="true"></span> Checking your sessions for new lessons. New suggestions appear here when it's done.`;
  if (s.needsModel) return `muninn can't check your sessions until its local model is downloaded (about 33 MB). Run <code>muninn learn --all-repos</code> once in a terminal.`;
  return `${s.lastLearn ? `muninn checked your sessions ${esc(ago(s.lastLearn))}` : "muninn hasn't checked your sessions yet"}, and checks again on its own after you work. <button class="linkbtn" data-scan>Check now</button>`;
}
let scanPoll = null;
/** Follows a running scan, then refreshes and says what it found. Also used when a scan started on its own. */
function followScan(before) {
  if (scanPoll) return;
  scanPoll = setInterval(async () => {
    const s = await api("/api/scan").catch(() => null);
    if (!s || s.running) return;
    clearInterval(scanPoll); scanPoll = null; await refresh();
    const found = data.suggested.length - before;
    toast(found > 0 ? `Found ${found} new suggestion${found === 1 ? "" : "s"}.` : "Checked your sessions. Nothing new this time.");
  }, 4000);
}
async function startScan(btn) {
  if (btn) btn.disabled = true;
  const before = data.suggested.length;
  await api("/api/scan", {});
  data.scan.running = true; draw();
  followScan(before);
}

/* When a kept lesson is told, in words. */
function whenText(l) {
  const w = l.always_on ? "Every session" : l.triggers.length ? `When "${l.triggers.join('", "')}" comes up` : "Only when searched";
  return w + (l.scope === "global" ? " · all repos" : !repo ? ` · ${short(l.repo_id)}` : "");
}
function whenChoices(route, kws) {
  return `<span class="lbl">When to tell agents</span>
    <div class="choices" role="radiogroup" aria-label="When to tell agents">${["always", "keyword", "none"].map((r) => `<button role="radio" data-route="${r}" aria-checked="${r === route}">${WHEN[r]}</button>`).join("")}</div>
    <p class="hint" data-when-hint>${WHEN_HINT[route]}</p>
    <input type="text" data-f="kw" placeholder="Words that should bring it up, comma-separated" value="${esc(kws)}" ${route === "keyword" ? "" : "hidden"}>
    <div class="replay"><button class="linkbtn" data-replay>When would this have been told?</button><div data-replay-out></div></div>`;
}

function suggestionRow(l) {
  const d = l.defaults;
  const isOpen = open === l.id;
  // From commands, the evidence is the runs themselves, shown as they were; from what you typed, your words.
  const runs = (l.evidence || []).some((e) => e.quote.startsWith("$ "));
  const ev = (l.evidence || []).slice(0, 3).map((e) => runs ? `<div class="mono run">${esc(e.quote)}</div>` : `<div>"${esc(e.quote)}"</div>`).join("");
  return `<li data-id="${esc(l.id)}">
    <div class="row">
      <button class="main" data-open="${esc(l.id)}" aria-expanded="${isOpen}"><div class="title">${esc(l.plain || l.text)}</div><div class="sub">${esc(l.origin)}</div>${l.worth ? `<div class="sub">${esc(l.worth)}</div>` : ""}</button>
      <button class="x" data-dismiss="${esc(l.id)}" aria-label="Don't suggest this" title="Don't suggest this">×</button>
      <button class="add" data-add="${esc(l.id)}">Add</button>
    </div>
    ${isOpen ? `<div class="detail">
      <label for="t-${esc(l.id)}">What agents are told</label>
      <textarea id="t-${esc(l.id)}" rows="3" data-f="text">${esc(l.text)}</textarea>
      ${whenChoices(d.route, (d.keywords.length ? d.keywords : l.suggested || []).join(", "))}
      ${l.scope !== "global" ? `<label class="checkline"><input type="checkbox" data-f="global" ${d.global ? "checked" : ""}> Tell agents in all my repos, not just this one</label>` : ""}
      ${ev ? `<div class="evidence">${runs ? "What ran in your session:" : ["repeat", "correction", "explained"].includes(l.signal) ? "You said:" : "From your session:"} ${ev}</div>` : ""}
      <div class="btns"><button class="btn primary" data-add="${esc(l.id)}" data-custom="1">Add</button><button class="btn" data-open="${esc(l.id)}">Cancel</button></div>
    </div>` : ""}
  </li>`;
}
function lessonRow(l) {
  const c = data.home.cameBack.find((x) => x.id === l.id);
  const last = data.home.carry.find((x) => x.id === l.id)?.lastTold;
  const route = l.always_on ? "always" : l.triggers.length ? "keyword" : "none";
  const isOpen = open === l.id;
  return `<li data-id="${esc(l.id)}">
    <div class="row ${l.off ? "off" : ""}">
      <button class="main" data-open="${esc(l.id)}" aria-expanded="${isOpen}">
        <div class="title">${esc(l.plain || l.text)}</div>
        <div class="sub">${l.off ? "Off · agents aren't told this" : esc(whenText(l)) + (last ? ` · last told ${esc(ago(last))}` : "")}</div>
        ${c && !l.off ? `<div class="warnline">The problem came back. ${esc(c.verdict.replace(/ Make it always-on\?$/, ""))}</div>` : ""}
      </button>
      <button class="switch" role="switch" aria-checked="${!l.off}" aria-label="${l.off ? "Off" : "On"}: ${esc(l.plain || l.text)}" data-toggle="${esc(l.id)}"></button>
    </div>
    ${c && c.fix && !l.off && !isOpen ? `<div style="padding:0 18px 12px"><button class="fix" data-fix="${esc(l.id)}">Tell agents every session</button></div>` : ""}
    ${isOpen ? `<div class="detail">
      <label for="t-${esc(l.id)}">What agents are told</label>
      <textarea id="t-${esc(l.id)}" rows="3" data-f="text">${esc(l.text)}</textarea>
      ${whenChoices(route, l.triggers.join(", "))}
      <label for="r-${esc(l.id)}">Applies to</label>
      <select id="r-${esc(l.id)}" data-f="applies" style="height:38px;border:1px solid var(--line-strong);border-radius:10px;background:var(--group);padding:0 10px;font-size:14px">
        <option value="*" ${l.scope === "global" ? "selected" : ""}>All repos</option>
        ${[...new Set([l.repo_id, ...data.repos.map((r) => r.id)].filter(Boolean))].map((r) => `<option value="${esc(r)}" ${l.scope !== "global" && r === l.repo_id ? "selected" : ""}>${esc(short(r))}${r === l.repo_id ? " (where it was learned)" : ""}</option>`).join("")}
      </select>
      <div class="btns"><button class="btn primary" data-save="${esc(l.id)}">Save</button><button class="btn" data-open="${esc(l.id)}">Cancel</button><button class="btn textbtn" data-remove="${esc(l.id)}">Remove lesson</button></div>
    </div>` : ""}
  </li>`;
}

function draw() {
  const { repos, suggested, kept, home } = data;
  const shown = showAll ? suggested : suggested.slice(0, 3);
  const dial = home.dial;
  $("#main").innerHTML = `
    <div class="top"><span>muninn ·</span>
      <label class="vh" for="repo">Repo</label>
      <select id="repo"><option value="" ${repo ? "" : "selected"}>All repos</option>${[...new Set([HERE, repo].filter((r) => r && !repos.some((x) => x.id === r)))].map((r) => `<option value="${esc(r)}" ${r === repo ? "selected" : ""}>${esc(short(r))}${r === HERE ? " (this folder)" : ""}</option>`).join("")}${repos.map((r) => `<option value="${esc(r.id)}" ${r.id === repo ? "selected" : ""}>${esc(short(r.id))}</option>`).join("")}</select>
    </div>
    <h1>What your agents know</h1>
    <p class="lead">Switch a lesson on and Claude, Codex and Cursor are told it. Switch it off and they aren't.</p>
    <p class="scan">${scanLine()}</p>

    ${(() => {
      // Suggestions waiting in other repos are easy to miss, since the page opens on the repo it was started from.
      const others = repo ? repos.filter((r) => r.id !== repo && r.waiting) : [];
      return others.length ? `<p class="scan" style="margin-top:14px">Also waiting in other repos: ${others.map((r) => `<button class="linkbtn" data-repo="${esc(r.id)}">${esc(short(r.id))} (${r.waiting})</button>`).join(", ")}</p>` : "";
    })()}
    ${suggested.length ? `<section aria-labelledby="sg">
      <h2 id="sg">Suggested from your sessions · ${suggested.length}</h2>
      <ul class="group">${shown.map(suggestionRow).join("")}
        ${suggested.length > 3 ? `<li><button class="more" data-more>${showAll ? "Show fewer" : `See all ${suggested.length} suggestions`}</button></li>` : ""}
      </ul>
      <p class="note">Tap a suggestion to change its wording or when it's told before adding it.</p>
    </section>` : ""}

    ${memorySection()}

    ${planSection()}

    <section aria-labelledby="ls">
      <h2 id="ls">Your lessons · ${kept.length}</h2>
      ${kept.length ? `<ul class="group">${kept.map(lessonRow).join("")}</ul><p class="note">Tap a lesson to change its wording or when it's told.</p>`
        : `<ul class="group"><li class="empty">${suggested.length ? "Add a suggestion above and it shows here." : `Nothing yet. muninn looks through your past Claude Code, Codex and Cursor sessions and suggests lessons here.<div style="margin-top:12px"><button class="btn primary" data-scan ${data.scan.running ? "disabled" : ""}>${data.scan.running ? "Checking…" : "Find lessons in my sessions"}</button></div>`}</li></ul>`}
    </section>

    ${repo ? `<section aria-labelledby="st">
      <h2 id="st">Settings for ${esc(short(repo))}</h2>
      <ul class="group">
        <li><div class="row"><div class="main" style="cursor:default"><div class="title">Tell agents when a session starts</div><div class="sub">Lessons told every session, and where you left off last time.</div></div>
          <button class="switch" role="switch" aria-checked="${dial !== "quiet"}" aria-label="Tell agents when a session starts" data-dial="start"></button></div></li>
        <li><div class="row"><div class="main" style="cursor:default"><div class="title">Tell agents mid-task too</div><div class="sub">When a word you chose comes up, or a command fails the way it has before.</div></div>
          <button class="switch" role="switch" aria-checked="${dial === "anytime"}" aria-label="Tell agents mid-task too" data-dial="mid"></button></div></li>
        <li><div class="row"><div class="main" style="cursor:default"><div class="title">Keep a copy of the plan in PLAN.md</div><div class="sub">Written at the root of this repo with the plan of the branch checked out, so each branch carries its own in git.</div></div>
          <button class="switch" role="switch" aria-checked="${!!data.plan?.fileOn}" aria-label="Keep a copy of the plan in PLAN.md" data-plan-file></button></div></li>
      </ul>
      ${dial === "quiet" ? `<p class="note">Both off: muninn tells agents nothing unless they ask with muninn ask.</p>` : ""}
    </section>` : ""}`;
}
async function refresh() { await load(); draw(); if (data.scan.running) followScan(data.suggested.length); }
async function savePlanInput() {
  const input = $("[data-plan-input]"); if (!input) return;
  const text = input.value.trim();
  if (!text) { planEdit = null; draw(); return; }
  if (input.dataset.kind === "status") await planDo({ action: "status", text });
  else if (input.dataset.id) await planDo({ action: "edit", id: input.dataset.id, text });
  else await planDo({ action: "add", kind: input.dataset.kind, text });
  toast("Saved to the plan.");
}
document.addEventListener("input", (e) => {
  if (e.target.id !== "doneFilter") return;
  doneFilter = e.target.value; $("#doneList").innerHTML = doneList(data.plan.plan.done);
});
document.addEventListener("keydown", (e) => {
  if (!e.target.matches?.("[data-plan-input]")) return;
  if (e.key === "Enter") { e.preventDefault(); savePlanInput().catch((err) => toast(err.message)); }
  if (e.key === "Escape") { planEdit = null; draw(); }
});

document.addEventListener("click", async (e) => {
  const el = e.target.closest("button"); if (!el) return;
  const li = el.closest("li[data-id]");
  try {
    if (el.dataset.open) { open = open === el.dataset.open ? null : el.dataset.open; draw(); return; }
    if (el.dataset.more !== undefined) { showAll = !showAll; draw(); return; }
    // The plan
    if (el.dataset.planEdit) { planEdit = el.dataset.planEdit; draw(); $("#pe")?.focus(); return; }
    if (el.dataset.planNew !== undefined) { planEdit = "new"; draw(); $("#pe")?.focus(); return; }
    if (el.dataset.planCancel !== undefined) { planEdit = null; draw(); return; }
    if (el.dataset.planSave !== undefined) { await savePlanInput(); return; }
    if (el.dataset.planClose) { el.setAttribute("aria-checked", "true"); await planDo({ action: "close", id: el.dataset.planClose }); toast("Marked done."); return; }
    if (el.dataset.planReopen) { await planDo({ action: "reopen", id: el.dataset.planReopen }); toast("Reopened."); return; }
    if (el.dataset.planRemove) { await planDo({ action: "remove", id: el.dataset.planRemove }); toast("Removed from the plan."); return; }
    if (el.dataset.doneMore !== undefined) { doneLimit += 15; $("#doneList").innerHTML = doneList(data.plan.plan.done); return; }
    if (el.dataset.memRemove || el.dataset.memRestore || el.dataset.memKeep) {
      const action = el.dataset.memRemove ? "remove" : el.dataset.memRestore ? "restore" : "keep";
      await api("/api/memory", { action, id: el.dataset.memRemove || el.dataset.memRestore || el.dataset.memKeep });
      data.memory = await api("/api/memory?" + q({ repo })); draw();
      toast(action === "remove" ? "Removed the line. Put it back from here today if you need it." : action === "restore" ? "Put the line back." : "Kept. muninn won't ask about this line again.");
      return;
    }
    if (el.dataset.planToggle) { planShow[el.dataset.planToggle] = !planShow[el.dataset.planToggle]; draw(); return; }
    if (el.dataset.planFile !== undefined) {
      const on = el.getAttribute("aria-checked") !== "true";
      const r = await api("/api/plan-file", { repo, on }); data.plan.fileOn = r.fileOn; draw();
      toast(r.fileOn ? "PLAN.md is written at the root of this repo, and kept up to date." : "PLAN.md is no longer updated. The file stays where it is."); return;
    }
    if (el.dataset.scan !== undefined) { await startScan(el); return; }
    if (el.dataset.repo) { repo = el.dataset.repo; open = null; showAll = false; await refresh(); window.scrollTo(0, 0); return; }
    if (el.dataset.replay !== undefined) {
      const box = el.closest(".detail"); const li = el.closest("li[data-id]");
      const l = [...data.suggested, ...data.kept].find((x) => x.id === li?.dataset.id);
      const route = box.querySelector("[data-route][aria-checked=true]").dataset.route;
      const out = box.querySelector("[data-replay-out]");
      out.innerHTML = `<p class="hint">Reading your past sessions…</p>`;
      try {
        const r = await api("/api/replay", { repo: l?.repo_id || repo, route, words: box.querySelector("[data-f=kw]").value });
        out.innerHTML = `<p class="hint" style="color:var(--ink)">${esc(r.sentence)}</p>` + (r.examples.length ? `<ul class="replaylist">${r.examples.map((x) => `<li><span class="sub">${esc(shortDate(x.at))} · ${esc(x.where)}</span><div class="mono">${esc(x.text)}</div></li>`).join("")}</ul>` : "");
      } catch (err) { out.innerHTML = `<p class="hint">${esc(err.message)}</p>`; }
      return;
    }
    if (el.dataset.route) {
      const box = el.closest(".detail"); box.querySelectorAll("[data-route]").forEach((b) => b.setAttribute("aria-checked", String(b === el)));
      box.querySelector("[data-when-hint]").textContent = WHEN_HINT[el.dataset.route];
      const kw = box.querySelector("[data-f=kw]"); kw.hidden = el.dataset.route !== "keyword"; if (!kw.hidden) kw.focus(); return;
    }
    if (el.dataset.add) {
      const l = data.suggested.find((x) => x.id === el.dataset.add);
      let body = { id: l.id, action: "keep", route: l.defaults.route, keywords: l.defaults.keywords.join(", "), global: l.defaults.global };
      if (el.dataset.custom) {
        const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
        if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
        const g = box.querySelector("[data-f=global]");
        body = { id: l.id, action: "keep", text: box.querySelector("[data-f=text]").value, route, keywords: kws, ...(g ? { global: g.checked } : {}) };
      }
      el.disabled = true; await api("/api/decide", body); open = null; toast("Added. Agents are told it from their next session."); await refresh(); return;
    }
    if (el.dataset.dismiss) { el.disabled = true; await api("/api/decide", { id: el.dataset.dismiss, action: "reject" }); toast("muninn won't suggest that again."); await refresh(); return; }
    if (el.dataset.toggle) {
      const l = data.kept.find((x) => x.id === el.dataset.toggle); const turnOff = !l.off;
      el.setAttribute("aria-checked", String(!turnOff));
      await api("/api/decide", { id: l.id, action: turnOff ? "off" : "on" });
      toast(turnOff ? "Off. Agents aren't told this until you switch it back on." : "On. Agents are told this again."); await refresh(); return;
    }
    if (el.dataset.fix) { el.disabled = true; await api("/api/decide", { id: el.dataset.fix, action: "save", route: "always" }); toast("Agents are told it every session now."); await refresh(); return; }
    if (el.dataset.save) {
      const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
      if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
      el.disabled = true;
      const applies = box.querySelector("[data-f=applies]").value;
      await api("/api/decide", { id: el.dataset.save, action: "save", text: box.querySelector("[data-f=text]").value, route, keywords: kws, global: applies === "*", ...(applies !== "*" ? { repo: applies } : {}) });
      open = null; toast("Saved. Agents get the new version from their next session."); await refresh(); return;
    }
    if (el.dataset.remove) {
      if (!confirm("Remove this lesson? Agents won't be told it, and it leaves your list. To pause it instead, switch it off.")) return;
      await api("/api/decide", { id: el.dataset.remove, action: "retire" }); open = null; toast("Removed."); await refresh(); return;
    }
    if (el.dataset.dial) {
      const d = data.home.dial; const startOn = d !== "quiet"; const midOn = d === "anytime";
      // Two switches, three settings: both off = only when asked; start only; start and mid-task.
      const next = el.dataset.dial === "start" ? (startOn ? "quiet" : midOn ? "anytime" : "start") : (midOn ? (startOn ? "start" : "quiet") : "anytime");
      await api("/api/dial", { repo, dial: next });
      toast({ quiet: "muninn won't tell agents anything here unless they ask.", start: "muninn tells agents only when a session starts.", anytime: "muninn tells agents at the start, and mid-task when relevant." }[next]);
      await refresh(); return;
    }
  } catch (err) { toast(err.message); el.disabled = false; }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "repo") { repo = e.target.value; open = null; showAll = false; planBranch = null; refresh(); }
  if (e.target.id === "planBranch") { planBranch = e.target.value; planEdit = null; planShow.decisions = planShow.done = false; doneFilter = ""; doneLimit = 15; refresh(); }
});
refresh().catch((e) => { $("#main").innerHTML = `<p class="lead">${esc(e.message)}</p>`; });

// Stay current without a manual reload: reload when muninn's code or this page changes, and refresh the lists
// in the background unless you're editing.
let version = null;
setInterval(async () => {
  try { const v = await api("/api/version"); const key = `${v.boot}:${v.page}`; if (version && key !== version) location.reload(); version = key; } catch { /* restarting */ }
}, 2000);
const quietRefresh = async () => { if (open || document.visibilityState !== "visible" || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return; try { await refresh(); } catch { /* try later */ } };
setInterval(quietRefresh, 30000);
window.addEventListener("focus", quietRefresh);
</script>
</body>
</html>
