<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>muninn</title>
<style>
/* Design C, "Switches": one screen, like phone settings. Suggestions with Add, your lessons with on/off switches,
   two settings. See docs/design-language.md. No web fonts, so the page makes no requests off this machine. */
:root {
  --bg: #F5F5F3; --group: #FFFFFF; --line: #EDEDEA; --line-strong: #DADAD6;
  --ink: #1C1D21; --muted: #6B6E76; --faint: #9A9CA3;
  --on: #1F7A45; --off: #D9D9D5; --link: #2B3AB8; --chip: #EDEFFE; --warn: #B23E06; --warn-bg: #FDF1EA;
  --fill: #F0F0EC; --diff-add: #067647; --diff-del: #B42318;
  --sans: Inter, "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111214; --group: #1C1D21; --line: #2A2C31; --line-strong: #3A3C43; --ink: #ECECEF; --muted: #A1A3AB; --faint: #74767E;
    --on: #3DBB72; --off: #3A3C43; --link: #A9B1FF; --chip: #262B4D; --warn: #FF9C6E; --warn-bg: #2A1E17;
    --fill: #24262B; --diff-add: #6CD49A; --diff-del: #FF8A80; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; } /* a class that sets display mustn't bring back something hidden */
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--sans); }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--link); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
main { max-width: 680px; margin: 0 auto; padding: 36px 20px 72px; }
.top { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
h1 { margin: 4px 0 0; font-size: 30px; font-weight: 600; letter-spacing: -.4px; line-height: 1.2; }
.lead { margin: 6px 0 0; color: var(--muted); }
section { margin-top: 30px; }
h2 { margin: 0 0 8px 4px; font-size: 13px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); }
.group { list-style: none; margin: 0; padding: 0; background: var(--group); border-radius: 14px; overflow: hidden; }
.group > li { border-top: 1px solid var(--line); }
.group > li:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; }
.row .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; }
.row .sub { font-size: 13px; color: var(--muted); }
.row .warnline { font-size: 13px; color: var(--warn); margin-top: 2px; }
.row.off .title { color: var(--faint); }
.note { margin: 8px 4px 0; font-size: 13px; color: var(--muted); }
.more { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 14px 18px; color: var(--link); font-weight: 500; cursor: pointer; }
.add { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--chip); color: var(--link); font-size: 14px; font-weight: 600; cursor: pointer; flex: none; }
.x { width: 34px; height: 34px; border: 0; border-radius: 999px; background: none; color: var(--faint); cursor: pointer; flex: none; font-size: 18px; line-height: 1; }
.x:hover { background: var(--bg); color: var(--muted); }
.switch { width: 46px; height: 28px; border-radius: 999px; border: 0; padding: 0; background: var(--off); position: relative; cursor: pointer; flex: none; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); transition: left .15s; }
.switch[aria-checked="true"] { background: var(--on); }
.switch[aria-checked="true"]::after { left: 21px; }
.switch:disabled { opacity: .5; cursor: default; }
.detail { padding: 4px 18px 18px; }
.detail label, .detail .lbl { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 6px; }
textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); font: 14px/1.6 var(--mono); resize: vertical; }
input[type=text] { width: 100%; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--group); padding: 0 12px; margin-top: 8px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; }
.choices button[aria-checked="true"] { border-color: var(--ink); background: var(--ink); color: var(--group); }
.checkline, .detail .checkline { display: flex; gap: 8px; align-items: center; font-size: 14px; font-weight: 400; margin-top: 14px; width: auto; }
.checkline input { margin: 0; width: 16px; height: 16px; flex: none; }
.hint { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
.replay { margin-top: 10px; }
.replaylist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 8px; }
.replaylist .mono { font-size: 12px; margin-top: 2px; }
.replaylist li, .replaylist .sub { font-size: 12px; font-weight: 400; color: var(--muted); padding: 0; }
.btns { display: flex; gap: 10px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--group); cursor: pointer; font-size: 14px; }
.btn.primary { background: var(--ink); border-color: var(--ink); color: var(--group); font-weight: 600; }
.btn.textbtn { border: 0; background: none; padding: 0; height: auto; color: var(--warn); margin-left: auto; }
.fix { height: 30px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--warn-bg); color: var(--warn); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
.evidence { font-size: 13px; color: var(--muted); margin-top: 12px; }
.evidence .run { margin-top: 6px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; color: var(--ink); white-space: pre-wrap; }
.empty { padding: 16px 18px; color: var(--muted); }
.check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--group); cursor: pointer; flex: none; padding: 0; }
.check:hover { border-color: var(--on); }
.check[aria-checked="true"] { background: var(--on); border-color: var(--on); }
.sublist { list-style: none; margin: 0; padding: 0 18px 12px; }
.mono { font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
code { font: .9em var(--mono); background: var(--fill); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
pre code { background: none; padding: 0; }
.diff { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--fill); border-radius: 8px; padding: 10px; margin: 8px 0 0; max-height: 220px; overflow: auto; }
.diff .plus { color: var(--diff-add); } .diff .minus { color: var(--diff-del); }
/* One look for the repo and branch pickers. */
.picker { border: 0; background: none; color: var(--ink); font-size: 14px; font-weight: 600; padding: 2px 0; cursor: pointer; }
.field { flex: 1 1 260px; min-width: 0; height: 40px; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; font-size: 15px; background: var(--bg); color: var(--ink); }
.rowlabel { padding: 12px 18px 0; font-size: 13px; color: var(--muted); }
.donebox input[type=search] { margin: 0 18px 10px; width: calc(100% - 36px); box-sizing: border-box; }
.doneday { padding: 6px 18px 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.sublist li { padding: 6px 0; font-size: 15px; display: flex; gap: 8px; align-items: baseline; }
.sublist .x { width: 26px; height: 26px; font-size: 15px; margin-left: auto; }
.scan { margin: 10px 0 0; font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--link); font-size: 14px; font-weight: 500; cursor: pointer; }
.linkbtn:disabled { opacity: .5; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--ink); animation: spin 1s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--group); padding: 9px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .switch, .switch::after, .toast { transition: none; } }
/* Ask secondnature: a panel on the right; the page moves over on wide screens and it covers the page on narrow ones. */
.askbtn { margin-left: auto; height: 32px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--chip); color: var(--link); font-size: 14px; font-weight: 600; cursor: pointer; }
.askpanel { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--group); border-left: 1px solid var(--line-strong); display: flex; flex-direction: column; z-index: 5; }
@media (min-width: 1100px) { body.ask-open main { margin-right: 440px; margin-left: max(20px, calc((100vw - 440px - 680px) / 2)); } }
.askhead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.askttl { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ink); }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.askbody { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.askempty p { margin: 0 0 8px; } .askempty .sub { font-size: 14px; color: var(--muted); }
.asktry { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 14px; }
.asktry .hchip { text-align: left; padding: 6px 13px; line-height: 1.35; }
.turn { display: flex; flex-direction: column; gap: 10px; }
.askq-b { align-self: flex-end; max-width: 85%; background: var(--ink); color: var(--group); padding: 9px 14px; border-radius: 14px 14px 4px 14px; font-size: 15px; }
.aska { font-size: 15px; line-height: 1.6; }
.cite { border: 0; background: var(--chip); color: var(--link); font: 600 12px/1 var(--sans); padding: 3px 6px; margin: 0 1px; border-radius: 6px; cursor: pointer; vertical-align: 1px; }
.cite:hover, .cite:focus-visible { background: var(--link); color: var(--group); }
.askprog { display: flex; flex-direction: column; gap: 9px; padding: 12px 14px; border-radius: 12px; background: var(--bg); }
.askprog-h { font-size: 14px; font-weight: 600; }
.askstep { display: flex; align-items: center; gap: 10px; font-size: 14px; }
.askstep.done { color: var(--on); } .askstep.later { color: var(--faint); }
.askstep .spin { margin: 2px; } .askstep .dot { width: 12px; height: 12px; margin: 2px; border-radius: 50%; border: 2px solid var(--line-strong); flex: none; }
.askprog-t { font-size: 12px; color: var(--muted); }
.askerr { color: var(--warn); } .asknone { color: var(--muted); margin: 0; }
.srcs-h { font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.srcs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.src { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; transition: border-color .2s, background .2s; scroll-margin: 12px; }
.src.lit { border-color: var(--link); background: var(--chip); }
.srcn { flex: none; width: 22px; height: 22px; border-radius: 6px; background: var(--chip); color: var(--link); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.src.lit .srcn { background: var(--link); color: var(--group); }
.srcb { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.srch { font-size: 13px; color: var(--muted); } .srch b { color: var(--ink); font-weight: 600; }
.srct { font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
.srcl { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.srcl a { text-decoration: none; } .srcl a:hover { text-decoration: underline; } .srcl .linkbtn { font-size: 13px; }
.askform { display: flex; gap: 8px; padding: 12px 18px 6px; border-top: 1px solid var(--line); }
.askfoot { margin: 0; padding: 0 18px 12px; font-size: 12px; color: var(--muted); }
.threads { list-style: none; margin: 0; padding: 0; }
.threads li { display: flex; align-items: center; gap: 8px; border-top: 1px solid var(--line); padding: 10px 0; }
.threads li:first-child { border-top: 0; }
.threads .main { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 0; cursor: pointer; }
.threads .title { font-weight: 500; } .threads .sub { font-size: 13px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .src { transition: none; } }
/* Plan history: outcomes and decisions */
.hist { border-top: 1px solid var(--line); }
.htabs { display: flex; gap: 4px; padding: 6px 6px 0; border-bottom: 1px solid var(--line); }
.htab { all: unset; cursor: pointer; min-height: 44px; padding: 0 12px; font-size: 15px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; border-bottom: 2px solid transparent; color: var(--muted); }
.htab[aria-selected="true"] { border-color: var(--ink); color: var(--ink); }
.htab span { font-weight: 500; color: var(--muted); }
.hbar { display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 4px; }
.hrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hsearch { flex: 1 1 240px; min-width: 0; height: 40px; box-sizing: border-box; border: 1px solid var(--line-strong); border-radius: 10px; padding: 0 12px; font-size: 15px; background: var(--bg); color: var(--ink); }
.hchip { all: unset; cursor: pointer; min-height: 34px; padding: 0 13px; border-radius: 999px; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.hchip[aria-pressed="true"] { background: var(--ink); color: var(--group); border-color: var(--ink); }
.hchip span { opacity: .7; }
.hlist { padding: 0 18px 14px; }
.hday { margin: 16px 0 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.hitem { border-top: 1px solid var(--line); }
.hhead { all: unset; cursor: pointer; display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 12px 0; width: 100%; box-sizing: border-box; }
.hhead svg { margin-top: 3px; transition: transform .15s; }
.hhead[aria-expanded="true"] svg { transform: rotate(90deg); }
.htitle { font-size: 15px; font-weight: 600; line-height: 1.35; }
.hres { font-size: 14px; line-height: 1.45; color: var(--muted); margin-top: 3px; }
.hmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 6px; }
.hkind { padding: 2px 8px; border-radius: 6px; font-weight: 600; background: var(--chip); color: var(--link); }
.hkind.fixed, .hkind.new { background: var(--warn-bg); color: var(--warn); }
.hkind.checked, .hkind.explored { background: var(--bg); color: var(--muted); }
.href { font: 12px ui-monospace, Menlo, monospace; color: var(--link); white-space: nowrap; padding-top: 3px; }
.hsteps { list-style: none; margin: 0 0 14px 28px; padding: 0; display: flex; flex-direction: column; gap: 2px; font-size: 14px; line-height: 1.45; }
.hstep { display: flex; gap: 12px; align-items: flex-start; padding: 5px 0; }
.hstep > span:last-child { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hstep.routine { color: var(--muted); }
.hstep .check { display: inline-flex; align-items: center; justify-content: center; color: var(--group); margin-top: -1px; }
.hstep .check:hover, .hstep .check:focus-visible { background: var(--group); color: var(--on); }
.hdot { flex: none; width: 22px; height: 20px; display: flex; align-items: center; justify-content: center; }
.hdot::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--line-strong); }
.hby { font-size: 12px; color: var(--muted); }
.hstep.bysession { background: var(--warn-bg); border-radius: 10px; padding: 7px 10px; margin: 2px -10px; }
.hstep.bysession .hby { color: var(--warn); font-weight: 500; }
.row.back { background: var(--warn-bg); }
.row.back .sub { color: var(--warn); font-weight: 500; }
.toast button { border: 0; background: none; color: var(--chip); font: inherit; font-weight: 600; cursor: pointer; padding: 2px 4px; margin-left: 10px; }
.toast.act { pointer-events: auto; }
.hdec { border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 12px; padding: 12px 0; align-items: start; }
.hdec .why { font-size: 14px; line-height: 1.45; color: var(--muted); margin-top: 3px; }
.hdate { font-size: 12px; color: var(--muted); white-space: nowrap; padding-top: 3px; }
</style>
</head>
<body>
<main id="main" aria-live="polite"></main>
<aside id="askPanel" class="askpanel" aria-label="Ask secondnature" hidden></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const TOKEN = "__TOKEN__";
const HERE = __REPO__;
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = (r) => (r ? String(r).split("/").filter(Boolean).pop() : "all repos");
const q = (o) => new URLSearchParams(Object.entries(o).filter(([, v]) => v)).toString();
const ago = (iso) => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000), h = Math.round(m / 60);
  return m < 2 ? "just now" : m < 60 ? `${m} minutes ago` : m < 2880 ? `${h} hour${h === 1 ? "" : "s"} ago` : `${Math.round(m / 1440)} days ago`;
};
const WHEN = { always: "Every session", keyword: "When a word comes up", none: "Only if an agent looks it up" };
/* What each choice means, in a sentence under the choices. */
const WHEN_HINT = {
  always: "Told to agents at the start of every session in this repo.",
  keyword: "Told when one of these words is in your prompt, or in a command that failed.",
  none: "Never sent on its own. At the start of each session agents are told they can run muninn ask \"…\" to look things up, and this is one of the things they'd find.",
};
let repo = HERE || "";
let showAll = false;
let open = null; // the id of the row opened for editing
let data = null;
let planEdit = null; // the plan item being edited: an id, "goal", or "new"
let planBranch = null; // the branch whose plan is shown; null means the one checked out
const movedBack = new Set(); // steps unticked in Done this visit, marked in Next so you can see where they went

/* The running plan: built from your sessions' handoffs, and yours to edit. */
/** What's done, newest first, grouped by day and narrowed by the filter, so a long history stays easy to scan. */
/* Plan history: finished work grouped into outcomes, and decisions with their reasons. */
const hist = { tab: "done", area: "All", q: "", routine: false, open: {}, limit: 8 };
const dayLabel = (iso) => {
  // Local days, so "Today" and the date beside it agree near midnight.
  const local = (d) => d.toLocaleDateString("en-CA");
  const day = local(new Date(iso)), today = local(new Date()), yesterday = local(new Date(Date.now() - 864e5));
  return day === today ? `Today · ${shortDate(iso)}` : day === yesterday ? `Yesterday · ${shortDate(iso)}` : new Date(iso).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
};
const KIND_LABEL = { shipped: "Shipped", fixed: "Fixed", checked: "Checked", explored: "Explored", new: "Not grouped yet" };
const CHEVRON = '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function histItems() {
  const h = data.plan.history || { outcomes: [], ungrouped: [], decisions: [], areas: [] };
  const words = hist.q.toLowerCase().split(/\s+/).filter(Boolean);
  const has = (t) => words.every((w) => t.toLowerCase().includes(w));
  const outcomes = [
    ...(h.ungrouped.length ? [{ id: "new", title: `Just finished: ${h.ungrouped.length} step${h.ungrouped.length === 1 ? "" : "s"} not grouped yet`, result: "muninn groups finished steps into outcomes as your sessions go. These came in since it last did, and join an outcome within a few minutes, or at the next check.", kind: "new", area: null, ref: null, at: h.ungrouped.map((s) => s.at).sort().at(-1), steps: h.ungrouped }] : []),
    ...h.outcomes,
  ];
  return {
    h,
    outcomes: outcomes.filter((o) => (hist.area === "All" || o.area === hist.area) && (!words.length || has([o.title, o.result, o.ref || "", ...o.steps.map((s) => s.text)].join(" ")))),
    decisions: h.decisions.filter((d) => (hist.area === "All" || d.area === hist.area) && (!words.length || has(d.what + " " + (d.why || "")))),
  };
}
/* A finished step. One that was in Next shows the same round tick, filled in: untick it to move it back to Next.
   Steps a session ticked off are marked, since those are the ones most likely ticked too early. */
const TICK = '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function stepRow(s) {
  if (!s.reopenable) return `<li class="hstep${s.routine ? " routine" : ""}"><span class="hdot" aria-hidden="true"></span><span>${esc(s.text)}</span></li>`;
  const bySession = s.closedBy === "session";

      try {
        const r = await api("/api/replay", { repo: l?.repo_id || repo, route, words: box.querySelector("[data-f=kw]").value });
        out.innerHTML = `<p class="hint" style="color:var(--ink)">${esc(r.sentence)}</p>` + (r.examples.length ? `<ul class="replaylist">${r.examples.map((x) => `<li><span class="sub">${esc(shortDate(x.at))} · ${esc(x.where)}</span><div class="mono">${esc(x.text)}</div></li>`).join("")}</ul>` : "");
      } catch (err) { out.innerHTML = `<p class="hint">${esc(err.message)}</p>`; }
      return;
    }
    if (el.dataset.route) {
      const box = el.closest(".detail"); box.querySelectorAll("[data-route]").forEach((b) => b.setAttribute("aria-checked", String(b === el)));
      box.querySelector("[data-when-hint]").textContent = WHEN_HINT[el.dataset.route];
      const kw = box.querySelector("[data-f=kw]"); kw.hidden = el.dataset.route !== "keyword"; if (!kw.hidden) kw.focus(); return;
    }
    if (el.dataset.add) {
      const l = data.suggested.find((x) => x.id === el.dataset.add);
      let body = { id: l.id, action: "keep", route: l.defaults.route, keywords: l.defaults.keywords.join(", "), global: l.defaults.global };
      if (el.dataset.custom) {
        const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
        if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
        const g = box.querySelector("[data-f=global]");
        body = { id: l.id, action: "keep", text: box.querySelector("[data-f=text]").value, route, keywords: kws, ...(g ? { global: g.checked } : {}) };
      }
      el.disabled = true; await api("/api/decide", body); open = null; toast("Added. Agents are told it from their next session."); await refresh(); return;
    }
    if (el.dataset.dismiss) { el.disabled = true; await api("/api/decide", { id: el.dataset.dismiss, action: "reject" }); toast("muninn won't suggest that again."); await refresh(); return; }
    if (el.dataset.toggle) {
      const l = data.kept.find((x) => x.id === el.dataset.toggle); const turnOff = !l.off;
      el.setAttribute("aria-checked", String(!turnOff));
      await api("/api/decide", { id: l.id, action: turnOff ? "off" : "on" });
      toast(turnOff ? "Off. Agents aren't told this until you switch it back on." : "On. Agents are told this again."); await refresh(); return;
    }
    if (el.dataset.fix) { el.disabled = true; await api("/api/decide", { id: el.dataset.fix, action: "save", route: "always" }); toast("Agents are told it every session now."); await refresh(); return; }
    if (el.dataset.save) {
      const box = li.querySelector(".detail"); const route = box.querySelector("[data-route][aria-checked=true]").dataset.route; const kws = box.querySelector("[data-f=kw]").value;
      if (route === "keyword" && !kws.trim()) { toast("Add a word, or pick another option."); return; }
      el.disabled = true;
      const applies = box.querySelector("[data-f=applies]").value;
      await api("/api/decide", { id: el.dataset.save, action: "save", text: box.querySelector("[data-f=text]").value, route, keywords: kws, global: applies === "*", ...(applies !== "*" ? { repo: applies } : {}) });
      open = null; toast("Saved. Agents get the new version from their next session."); await refresh(); return;
    }
    if (el.dataset.remove) {
      if (!confirm("Remove this lesson? Agents won't be told it, and it leaves your list. To pause it instead, switch it off.")) return;
      await api("/api/decide", { id: el.dataset.remove, action: "retire" }); open = null; toast("Removed."); await refresh(); return;
    }
    if (el.dataset.dial) {
      const d = data.home.dial; const startOn = d !== "quiet"; const midOn = d === "anytime";
      // Two switches, three settings: both off = only when asked; start only; start and mid-task.
      const next = el.dataset.dial === "start" ? (startOn ? "quiet" : midOn ? "anytime" : "start") : (midOn ? (startOn ? "start" : "quiet") : "anytime");
      await api("/api/dial", { repo, dial: next });
      toast({ quiet: "muninn won't tell agents anything here unless they ask.", start: "muninn tells agents only when a session starts.", anytime: "muninn tells agents at the start, and mid-task when relevant." }[next]);
      await refresh(); return;
    }
  } catch (err) { toast(err.message); el.disabled = false; }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "histRoutine") { hist.routine = e.target.checked; $("#histList").innerHTML = histList(); return; }
  if (e.target.id === "repo") { repo = e.target.value; week = null; if (!asking) { askThread = []; askThreadId = null; } open = null; showAll = false; planBranch = null; refresh(); }
  if (e.target.id === "planBranch") { planBranch = e.target.value; planEdit = null; Object.assign(hist, { area: "All", q: "", open: {}, limit: 8 }); refresh(); }
});
refresh().catch((e) => { $("#main").innerHTML = `<p class="lead">${esc(e.message)}</p>`; });

// Stay current without a manual reload: reload when muninn's code or this page changes, and refresh the lists
// in the background unless you're editing.
let version = null;
setInterval(async () => {
  try { const v = await api("/api/version"); const key = `${v.boot}:${v.page}`; if (version && key !== version) location.reload(); version = key; } catch { /* restarting */ }
}, 2000);
const quietRefresh = async () => { if (open || document.visibilityState !== "visible" || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "")) return; try { await refresh(); } catch { /* try later */ } };
setInterval(quietRefresh, 30000);
window.addEventListener("focus", quietRefresh);
</script>
</body>
